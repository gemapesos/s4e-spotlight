<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S4E Spotlight Accounts</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">S4E Spotlight</p>
          <h1>Accounts</h1>
          <p class="page-description">Manage encrypted Seller Central stores and shared credentials.</p>
        </div>
        <div id="header-actions"></div>
      </header>
      <section id="app" aria-busy="true"></section>
    </main>
    <div id="notice" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden>
      <span class="toast-icon" aria-hidden="true"></span>
      <div class="toast-content">
        <p class="toast-title"></p>
        <p class="toast-description"></p>
      </div>
      <button class="toast-close" type="button" aria-label="Close notification">×</button>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
